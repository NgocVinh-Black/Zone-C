# Zone-C — kitty
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.5

window_padding_width 12
background_opacity 0.85
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_trail 3

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round

# Colours from the wallpaper (matugen); install.sh seeds a default.
include ~/.cache/zone-c/kitty-colors.conf
