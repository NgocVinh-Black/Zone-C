# Zone-C — Hyprland config
# Installed by install.sh as ~/.config/hypr. Edit the files in conf/.

source = ~/.config/hypr/conf/variables.conf
# Colours generated from the wallpaper by matugen (install.sh seeds a default).
source = ~/.cache/zone-c/hypr-colors.conf
source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/env.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/settings.conf
source = ~/.config/hypr/conf/rules.conf
source = ~/.config/hypr/conf/keybindings.conf

# Machine-specific overrides that are not tracked in git (created empty by install.sh).
source = ~/.config/hypr/local.conf
