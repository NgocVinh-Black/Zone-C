# Colours come from matugen (install.sh seeds a default).
source = ~/.cache/zone-c/hyprlock-colors.conf

general {
    hide_cursor = true
    grace = 2
}

background {
    path = ~/.cache/zone-c/wallpaper
    color = $background
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = $foreground
    font_size = 110
    font_family = JetBrains Mono ExtraBold
    position = 0, 180
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %B %d"
    color = $subtle
    font_size = 20
    font_family = JetBrains Mono Bold
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    size = 320, 56
    outline_thickness = 2
    rounding = 14
    outer_color = $accent
    inner_color = $surface
    font_color = $foreground
    check_color = $accent
    fail_color = $error
    placeholder_text = Password
    fade_on_empty = false
    dots_center = true
    position = 0, -80
    halign = center
    valign = center
}
