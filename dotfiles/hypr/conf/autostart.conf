exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprpaper
exec-once = hypridle
exec-once = swaync
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# The Zone-C shell (bar and popups). Logs: run it from a terminal instead.
exec-once = $shell
# Re-applies the last wallpaper and its colours.
exec-once = ~/.local/bin/zone-c-wallpaper --restore

# Theme for GTK apps and the cursor. gsettings is what GTK4 and portals read.
exec-once = hyprctl setcursor Adwaita 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme Adwaita
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark
exec-once = gsettings set org.gnome.desktop.interface icon-theme Papirus-Dark
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface font-name 'Noto Sans 11'

# Vietnamese input (switch with CTRL+Space)
exec-once = fcitx5 -d
# Stores passwords for browsers, VS Code, Slack…
exec-once = gnome-keyring-daemon --start --components=secrets
# Bluetooth headphone buttons control the media player
exec-once = mpris-proxy
# Creates ~/Downloads, ~/Documents… if missing
exec-once = xdg-user-dirs-update
# Empties trash older than 30 days
exec-once = trash-empty -f 30
# Night light, located through geoclue
exec-once = /usr/lib/geoclue-2.0/demos/agent
exec-once = sleep 1 && gammastep
