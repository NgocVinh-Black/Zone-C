general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $activeBorder
    col.inactive_border = $inactiveBorder
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 14

    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true

    bezier = smooth, 0.23, 1, 0.32, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, overshot, popin 80%
    animation = windowsOut, 1, 4, smooth, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, smooth
    animation = workspaces, 1, 5, smooth, slide
    animation = layers, 1, 4, smooth, fade
}

dwindle {
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

ecosystem {
    no_update_news = true
}
