# Keybinds follow the old Caelestia layout (arch-linux-setup) so muscle memory carries over.

# ── Launcher ────────────────────────────────────────────────────────────
# Tap SUPER alone. fcitx5 is switched off first: with Unikey active the rofi
# search box gets no characters (they stay in preedit and are never committed).
bindr = SUPER, SUPER_L, exec, fcitx5-remote -c 2>/dev/null; $launcher

# ── Apps ────────────────────────────────────────────────────────────────
bind = $mod, T, exec, $terminal
bind = $mod, W, exec, $browser
bind = $mod, G, exec, $browser
bind = $mod, C, exec, $editor
bind = $mod, E, exec, $fileManager
bind = CTRL ALT, V, exec, $audioSettings
bind = $mod SHIFT, W, exec, ~/.local/bin/zone-c-wallpaper --pick

# ── Zone-C popups ───────────────────────────────────────────────────────
bind = $mod, K, exec, $shell ipc call popup toggle clock ""
bind = $mod ALT, M, exec, $shell ipc call popup toggle media ""
bind = $mod, A, exec, $shell ipc call popup toggle volume ""
bind = $mod, B, exec, $shell ipc call popup toggle battery ""
bind = $mod SHIFT, N, exec, $shell ipc call popup toggle network wifi
bind = $mod SHIFT, B, exec, $shell ipc call popup toggle network bt

# ── Session and notifications ───────────────────────────────────────────
bind = CTRL ALT, Delete, exec, ~/.local/bin/zone-c-session
bind = $mod, N, exec, swaync-client -t -sw
bindl = CTRL ALT, C, exec, swaync-client -C
bind = $mod, L, exec, loginctl lock-session
# Brings the lock screen back if hyprlock crashed while locked.
bind = $mod ALT, L, exec, pidof hyprlock || hyprlock
bindl = $mod SHIFT, L, exec, systemctl suspend-then-hibernate || systemctl suspend

# Kill / restart the shell
bindr = CTRL $mod SHIFT, R, exec, qs -c zone-c kill
bindr = CTRL $mod ALT, R, exec, qs -c zone-c kill; sleep .1; qs -c zone-c -d

# ── Workspaces 1–10 ─────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod ALT, 1, movetoworkspace, 1
bind = $mod ALT, 2, movetoworkspace, 2
bind = $mod ALT, 3, movetoworkspace, 3
bind = $mod ALT, 4, movetoworkspace, 4
bind = $mod ALT, 5, movetoworkspace, 5
bind = $mod ALT, 6, movetoworkspace, 6
bind = $mod ALT, 7, movetoworkspace, 7
bind = $mod ALT, 8, movetoworkspace, 8
bind = $mod ALT, 9, movetoworkspace, 9
bind = $mod ALT, 0, movetoworkspace, 10

# Previous / next workspace
bind = $mod, mouse_down, workspace, -1
bind = $mod, mouse_up, workspace, +1
binde = CTRL $mod, left, workspace, -1
binde = CTRL $mod, right, workspace, +1
binde = $mod, Page_Up, workspace, -1
binde = $mod, Page_Down, workspace, +1
bind = CTRL $mod, mouse_down, workspace, -10
bind = CTRL $mod, mouse_up, workspace, +10

# Move the window to the previous / next workspace
binde = $mod ALT, Page_Up, movetoworkspace, -1
binde = $mod ALT, Page_Down, movetoworkspace, +1
bind = $mod ALT, mouse_down, movetoworkspace, -1
bind = $mod ALT, mouse_up, movetoworkspace, +1
binde = CTRL $mod SHIFT, left, movetoworkspace, -1
binde = CTRL $mod SHIFT, right, movetoworkspace, +1

# ── Special workspaces ──────────────────────────────────────────────────
# Each opens its app the first time it is shown (see rules.conf).
bind = $mod, S, togglespecialworkspace, special
bind = $mod, M, togglespecialworkspace, music
bind = $mod, D, togglespecialworkspace, communication
bind = $mod, R, togglespecialworkspace, notes
bind = CTRL SHIFT, Escape, togglespecialworkspace, sysmon
bind = CTRL $mod SHIFT, up, movetoworkspace, special:special
bind = CTRL $mod SHIFT, down, movetoworkspace, e+0
bind = $mod ALT, S, movetoworkspace, special:special

# ── Window groups ───────────────────────────────────────────────────────
binde = ALT, Tab, cyclenext
binde = SHIFT ALT, Tab, cyclenext, prev
binde = CTRL ALT, Tab, changegroupactive, f
binde = CTRL SHIFT ALT, Tab, changegroupactive, b
bind = $mod, Comma, togglegroup
bind = $mod, U, moveoutofgroup
bind = $mod SHIFT, Comma, lockactivegroup, toggle

# ── Windows ─────────────────────────────────────────────────────────────
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod ALT, F, fullscreen, 1
bind = $mod ALT, Space, togglefloating
bind = $mod, P, pin
bind = $mod, J, togglesplit

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Resize
binde = $mod, Minus, resizeactive, -50 0
binde = $mod, Equal, resizeactive, 50 0
binde = $mod SHIFT, Minus, resizeactive, 0 -50
binde = $mod SHIFT, Equal, resizeactive, 0 50
binde = $mod ALT, left, resizeactive, -50 0
binde = $mod ALT, right, resizeactive, 50 0
binde = $mod ALT, up, resizeactive, 0 -50
binde = $mod ALT, down, resizeactive, 0 50

# Drag with the mouse: SUPER + left/right button, or hold SUPER+Z / SUPER+X
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindm = $mod, Z, movewindow
bindm = $mod, X, resizewindow

# Centre; with ALT also resize to 55% x 70% first (floating windows)
bind = CTRL $mod, backslash, centerwindow
bind = CTRL $mod ALT, backslash, resizeactive, exact 55% 70%
bind = CTRL $mod ALT, backslash, centerwindow
# Picture-in-picture: float, shrink to the bottom-right corner, pin
bind = $mod ALT, backslash, setfloating
bind = $mod ALT, backslash, resizeactive, exact 30% 30%
bind = $mod ALT, backslash, moveactive, exact 68% 68%
bind = $mod ALT, backslash, pin

# ── Screenshots, recording, colour picker ───────────────────────────────
# Flameshot: GUI to select, annotate, copy or save (Enter copies, Ctrl+S saves)
bindl = , Print, exec, mkdir -p ~/Pictures/Screenshots && flameshot full -c -p ~/Pictures/Screenshots
bind = $mod SHIFT, S, exec, flameshot gui
# Same, after a 3 second delay (to capture menus and tooltips)
bind = $mod SHIFT ALT, S, exec, flameshot gui -d 3000
# Press again to stop. Files go to ~/Videos/Recordings.
bind = $mod ALT, R, exec, pkill -INT -x wf-recorder || (mkdir -p ~/Videos/Recordings && wf-recorder -g "$(slurp)" -f ~/Videos/Recordings/$(date +%F_%H-%M-%S).mp4)
bind = CTRL ALT, R, exec, pkill -INT -x wf-recorder || (mkdir -p ~/Videos/Recordings && wf-recorder -f ~/Videos/Recordings/$(date +%F_%H-%M-%S).mp4)
bind = $mod SHIFT ALT, R, exec, pkill -INT -x wf-recorder || (mkdir -p ~/Videos/Recordings && wf-recorder -g "$(slurp)" --audio -f ~/Videos/Recordings/$(date +%F_%H-%M-%S).mp4)
bind = $mod SHIFT, C, exec, hyprpicker -a

# ── Clipboard and emoji ─────────────────────────────────────────────────
bind = $mod, V, exec, pkill -x rofi || (cliphist list | rofi -dmenu -p Clipboard | cliphist decode | wl-copy)
bind = $mod ALT, V, exec, pkill -x rofi || (cliphist list | rofi -dmenu -p Delete | cliphist delete)
bind = $mod, Period, exec, pkill -x rofi || rofi -modi emoji -show emoji

# ── Volume ──────────────────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = $mod SHIFT, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ── Media and brightness ────────────────────────────────────────────────
bindl = CTRL $mod, Space, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = CTRL $mod, Equal, exec, playerctl next
bindl = , XF86AudioNext, exec, playerctl next
bindl = CTRL $mod, Minus, exec, playerctl previous
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%-

# ── Testing ─────────────────────────────────────────────────────────────
bind = $mod ALT, F12, exec, notify-send -u low -i dialog-information-symbolic -a Shell "Test notification" "Here's a really long message to test truncation and wrapping"
