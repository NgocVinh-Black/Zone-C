# ── Apps ────────────────────────────────────────────────────────────────
bind = $mod, Return, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, Space, exec, $launcher
bind = $mod, V, exec, cliphist list | rofi -dmenu -p Clipboard | cliphist decode | wl-copy
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod, W, exec, ~/.local/bin/zone-c-wallpaper --pick

# ── Zone-C popups ───────────────────────────────────────────────────────
bind = $mod, M, exec, $shell ipc call popup toggle media ""
bind = $mod, C, exec, $shell ipc call popup toggle clock ""
bind = $mod SHIFT, N, exec, $shell ipc call popup toggle network wifi
bind = $mod SHIFT, B, exec, $shell ipc call popup toggle network bt
bind = $mod, A, exec, $shell ipc call popup toggle volume ""
bind = $mod, P, exec, $shell ipc call popup toggle battery ""
bind = $mod SHIFT, R, exec, pkill -x qs; $shell

# ── Session ─────────────────────────────────────────────────────────────
bind = $mod, L, exec, loginctl lock-session
bind = $mod SHIFT, E, exit

# ── Windows ─────────────────────────────────────────────────────────────
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, togglefloating
bind = $mod, J, togglesplit
bind = $mod SHIFT, P, pseudo

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Workspaces 1–8 (the bar shows 8) ────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# ── Screenshots ─────────────────────────────────────────────────────────
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Region copied"
bind = SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png && notify-send "Screenshot" "Saved to ~/Pictures/Screenshots"

# ── Media and hardware keys ─────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
