# Blur the Zone-C bar and popups behind their translucent blocks.
layerrule = blur, zone-c-bar
layerrule = ignorezero, zone-c-bar
layerrule = blur, zone-c-popup
layerrule = ignorezero, zone-c-popup
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window

windowrule = float, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(com.github.wwmm.easyeffects)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = float, class:^(xdg-desktop-portal-gtk)$

# Don't let apps keep the screen awake behind a fullscreen window by accident.
windowrule = idleinhibit fullscreen, class:.*

# Special workspaces open their app the first time they are shown.
workspace = special:music, on-created-empty:$musicApp
workspace = special:communication, on-created-empty:$communicationApp
workspace = special:todo, on-created-empty:$todoApp
workspace = special:sysmon, on-created-empty:$sysmonApp
