# Hyprland 0.56 syntax: every comma-separated part is "field value", and the
# match is a field too, so `class:^(x)$` became `match:class ^(x)$`.

# Blur the Zone-C bar, popups, toasts and OSD behind their translucent surfaces.
layerrule = blur true, match:namespace ^(zone-c-bar)$
layerrule = ignore_alpha 0, match:namespace ^(zone-c-bar)$
layerrule = blur true, match:namespace ^(zone-c-popup)$
layerrule = ignore_alpha 0, match:namespace ^(zone-c-popup)$
layerrule = blur true, match:namespace ^(zone-c-toast)$
layerrule = ignore_alpha 0, match:namespace ^(zone-c-toast)$
layerrule = blur true, match:namespace ^(zone-c-osd)$
layerrule = ignore_alpha 0, match:namespace ^(zone-c-osd)$
layerrule = blur true, match:namespace ^(rofi)$
layerrule = ignore_alpha 0, match:namespace ^(rofi)$

windowrule = float true, match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float true, match:class ^(nm-connection-editor)$
windowrule = float true, match:class ^(blueman-manager)$
windowrule = float true, match:class ^(com.github.wwmm.easyeffects)$
windowrule = float true, match:title ^(Picture-in-Picture)$
windowrule = pin true, match:title ^(Picture-in-Picture)$
windowrule = float true, match:class ^(xdg-desktop-portal-gtk)$

# Don't let apps keep the screen awake behind a fullscreen window by accident.
windowrule = idle_inhibit fullscreen, match:class .*

# Special workspaces open their app the first time they are shown.
workspace = special:music, on-created-empty:$musicApp
workspace = special:communication, on-created-empty:$communicationApp
workspace = special:notes, on-created-empty:$notesApp
workspace = special:sysmon, on-created-empty:$sysmonApp

# Flameshot's capture overlay must cover the screen exactly, without animation.
windowrule = float true, match:class ^(flameshot)$
windowrule = no_anim true, match:class ^(flameshot)$
windowrule = pin true, match:class ^(flameshot)$
windowrule = move 0 0, match:class ^(flameshot)$
windowrule = border_size 0, match:class ^(flameshot)$
windowrule = rounding 0, match:class ^(flameshot)$
