# Programs and default colours (overridden by ~/.cache/zone-c/hypr-colors.conf).

$mod = SUPER
$terminal = kitty
$fileManager = thunar
$browser = firefox
$editor = code
$audioSettings = pavucontrol
$shell = qs -c zone-c

# Apps opened by the special workspaces (SUPER+M / D / R, CTRL+SHIFT+Esc).
# spotify, equibop and notion-app come from the AUR and install.sh does not
# pull them in; change these to what you actually have installed.
$musicApp = spotify
$communicationApp = equibop
$notesApp = notion-app
$sysmonApp = $terminal -e btop

$activeBorder = rgb(8fcef3)
$inactiveBorder = rgba(30363aaa)
