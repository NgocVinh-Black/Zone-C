[General]
; Hyprland has no screenshot API Flameshot understands natively; grim does the capture.
useGrimAdapter=true
disabledGrimWarning=true
savePath=@HOME@/Pictures/Screenshots
savePathFixed=true
saveAfterCopy=false
filenamePattern=%F_%H-%M-%S
showStartupLaunchMessage=false
showDesktopNotification=true
disabledTrayIcon=true
